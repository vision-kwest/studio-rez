name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: pytest

      - name: Run shellcheck when available
        shell: bash
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck env/*.sh scripts/studio-rez-print-env
          else
            echo "shellcheck not installed; skipping"
          fi

      - name: Run studio-rez doctor
        shell: bash
        run: |
          source env/studio-dev.sh
          studio-rez-doctor --soft
